<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">AboLife Icon Concept A - Life Dashboard</title>
  <desc id="desc">A calm circular dashboard ring with balanced life-domain segments around a centered core.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="900" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FAF8"/>
      <stop offset="0.48" stop-color="#DDEEE8"/>
      <stop offset="1" stop-color="#AFCBC5"/>
    </linearGradient>
    <radialGradient id="softLight" cx="32%" cy="22%" r="74%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.84"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="350" y1="300" x2="670" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDFEFE"/>
      <stop offset="1" stop-color="#E1EFEA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#24524D" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FFFFFF" flood-opacity="0.34"/>
    </filter>
    <filter id="segmentShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#214C48" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="232" fill="url(#softLight)"/>
  <circle cx="512" cy="512" r="374" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.55"/>
  <g filter="url(#shadow)">
    <circle cx="512" cy="512" r="284" fill="none" stroke="#E9F4F0" stroke-width="74"/>
    <g fill="none" stroke-linecap="round" filter="url(#segmentShadow)">
      <path d="M512 228 A284 284 0 0 1 745.5 350.4" stroke="#367C74" stroke-width="78"/>
      <path d="M784.6 430.3 A284 284 0 0 1 705.7 719.5" stroke="#E0B75F" stroke-width="78"/>
      <path d="M627.7 771.4 A284 284 0 0 1 337.3 736" stroke="#52749B" stroke-width="78"/>
      <path d="M279.9 675.5 A284 284 0 0 1 269.7 363.7" stroke="#87A96B" stroke-width="78"/>
      <path d="M337.3 288 A284 284 0 0 1 445.3 236" stroke="#9B7BA9" stroke-width="78"/>
    </g>
    <circle cx="512" cy="512" r="184" fill="url(#core)" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="512" cy="512" r="116" fill="#F8FCFA" stroke="#CFE1DB" stroke-width="10"/>
    <circle cx="512" cy="512" r="48" fill="#1F5E58"/>
    <circle cx="512" cy="512" r="20" fill="#F6FBF8"/>
  </g>
  <g fill="#FFFFFF" opacity="0.82">
    <circle cx="706" cy="325" r="13"/>
    <circle cx="755" cy="592" r="13"/>
    <circle cx="430" cy="761" r="13"/>
    <circle cx="256" cy="486" r="13"/>
    <circle cx="390" cy="276" r="13"/>
  </g>
</svg>
